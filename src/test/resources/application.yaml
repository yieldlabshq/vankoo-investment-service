spring:
  datasource:
    url: jdbc:h2:mem:investment;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  cloud:
    function:
      definition: processInvoiceEligibleForFunding;projectAuctionMarketplace
    discovery:
      enabled: false
    stream:
      default-binder: test

eureka:
  client:
    enabled: false

authorization:
  jwt:
    secret: test-secret
    expiration:
      days: 1

documentation:
  application:
    title: Vankoo Investment Service
    description: Test
    version: test
  local-url: http://localhost:8082
  gateway-url: http://localhost:8080/investment

vankoo:
  investment:
    pricing:
      version: test-2026-09
      zone-id: America/Lima
      day-count-basis: 360
      quote-validity: PT24H
      funding-window: P7D
      settlement-buffer: P1D
      platform-monthly-fee-rate: 0.003
      platform-fee-tax-rate: 0.18
      investor-tea:
        A: 0.12
        B: 0.15
        C: 0.18
      minimum-investment:
        PEN: 50.00
        USD: 15.00
    lifecycle:
      expiration-check-delay: PT1H

logging:
  level:
    root: WARN
